<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUT2001flashcards (4) — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>CUT2001flashcards (4)</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"Drill Bit Component: Shank","back":"The portion gripped by the drill chuck or collet to transmit rotational torque."},{"front":"Drill Bit Component: Flutes","back":"Helical grooves that evacuate chips and deliver coolant to the cutting edge."},{"front":"Drill Bit Component: Land","back":"The threaded portion between flutes that provides structural support and maintains bit diameter."},{"front":"Drill Bit Component: Margin","back":"The narrow strip along the leading edge of the land that guides the bit and maintains diameter accuracy."},{"front":"Drill Bit Component: Cutting Lips","back":"The two sharp edges at the point that perform the actual material removal."},{"front":"Drill Bit Component: Chisel Edge","back":"The small flat area at the center of the point that connects the lips and scrapes material."},{"front":"Drill Bit Component: Point Angle","back":"The angle formed between the two cutting lips that affects cutting aggressiveness and centering."},{"front":"Why is choosing the correct drill bit critical for aircraft assemblies?","back":"It maintains structural integrity, meets tight tolerances, and ensures airworthiness."},{"front":"Which drill bit type is most widely used for general-purpose drilling in aircraft manufacturing?","back":"Twist drill bits."},{"front":"What is the primary function of a step drill bit in sheet metal work?","back":"Drilling multiple hole sizes and automatically deburring the exit side in a single operation."},{"front":"Which category of drill bit is specifically designed for high-strength, abrasive materials like titanium and composites?","back":"Carbide-tipped bits."},{"front":"What is the purpose of a countersink bit?","back":"To create a conical seat for flush fastener heads in aircraft skin panels."},{"front":"Why can improperly drilled holes lead to structural failure in aircraft?","back":"They cause stress concentrations and fatigue cracking."},{"front":"How does Cobalt (HSS-Co) differ from standard High-Speed Steel (HSS) bits?","back":"It contains $5\\text{--}8\\%$ cobalt for greater hardness and heat resistance."},{"front":"Which bit coating is used to reduce friction and increase surface hardness in high-volume production?","back":"Titanium Nitride (TiN) or Titanium Aluminum Nitride (TiAlN)."},{"front":"In the wire gauge numbering system, how do gauge numbers relate to diameter size?","back":"Smaller gauge numbers indicate larger diameters."},{"front":"What is the diameter of a $\\#30$ drill bit?","back":"$0.1285$ inches."},{"front":"Which drill bit size is commonly used to drill holes for $\\frac{1}{8}$-inch rivets before reaming?","back":"$\\#30$ drill bit."},{"front":"What is the maximum recommended thickness for using step drill bits on aluminum sheet?","back":"$0.125$ inches."},{"front":"Term: Straight Shank","back":"The most common shank type used in standard pneumatic and electric drill motors."},{"front":"Which shank type is preferred for large-diameter bits in drill presses requiring high torque?","back":"Morse Taper Shank."},{"front":"What helix angle range is standard for drilling aluminum with twist bits?","back":"$28^{\\circ}\\text{--}32^{\\circ}$."},{"front":"How does a worn drill margin affect the quality of a drilled hole?","back":"It results in an undersized or rough hole."},{"front":"What is the consequence of 'margin rubbing' in titanium work-pieces?","back":"Excessive friction generates heat that can work-harden the material."},{"front":"Which point angle is the standard general-purpose angle for aluminum alloys?","back":"$118^{\\circ}$."},{"front":"What point angle is recommended for hard materials like stainless steel and titanium?","back":"$135^{\\circ}$."},{"front":"Which point angle is typically used for soft plastics and some composite materials?","back":"$90^{\\circ}$."},{"front":"Why must both cutting lips be ground to equal lengths and angles?","back":"Uneven lips cause the bit to drill an oversized hole."},{"front":"What tool or mark helps compensate for the scraping action of the chisel edge to start a hole accurately?","back":"A pilot hole or center punch mark."},{"front":"Term: Reamer","back":"A rotary cutting tool used to enlarge and finish pre-drilled holes to precise diameters and surface finishes."},{"front":"How much material does a reamer typically remove?","back":"Typically $0.003$ to $0.010$ inches."},{"front":"Which tool produces a superior surface finish compared to a standard drill bit?","back":"A reamer."},{"front":"What is the primary usage difference between Hand Reamers and Machine Reamers?","back":"Hand reamers are turned manually for fine adjustments; machine reamers are driven by motors for production speed."},{"front":"When is a Taper Reamer used in aircraft assembly?","back":"To create holes for fasteners requiring a tapered shank fit, such as heavy structural joints."},{"front":"How should the RPM of a reamer compare to the RPM of a drill bit for the same material?","back":"Reaming should be done at approximately half the RPM used for drilling."},{"front":"What happens if a reamer is rotated in the reverse direction?","back":"The cutting edges are dulled immediately and the tool is ruined."},{"front":"What are the four key considerations for selecting the right drill bit?","back":"Work-piece material, required hole size, material thickness, and hole purpose."},{"front":"Why is titanium considered a 'challenging material' to drill?","back":"It work-hardens rapidly under friction and requires aggressive heat management."},{"front":"Which drill bit setup is recommended for Carbon Fiber Reinforced Polymer (CFRP)?","back":"Solid carbide or diamond-coated bits with no coolant."},{"front":"What lubricant is recommended for drilling steel aircraft components?","back":"Sulfur-based cutting oil."},{"front":"When drilling a stack-up of different materials, which material should guide bit selection?","back":"The hardest or most demanding material in the stack-up."},{"front":"Term: Class 3 Fastener Fit","back":"An interference fit where the fastener is slightly larger than the hole and must be pressed in."},{"front":"What does a blue, gold, or black discoloration near the bit tip signify?","back":"The bit has overheated and lost its temper (hardness)."},{"front":"What is a likely cause of an oversized hole?","back":"Unequal cutting lips or a worn margin."},{"front":"What defect is prevented by using a center punch or a split-point bit?","back":"Drill walking."},{"front":"How should drill bits be stored to protect their cutting edges?","back":"In an indexed set or individual protective sleeves, never loose in a drawer."},{"front":"When can HSS or cobalt drill bits be reconditioned?","back":"When the cutting lips are dull but the general geometry remains intact."},{"front":"What is required to resharpen solid carbide drill bits?","back":"Diamond grinding wheels."},{"front":"Which fastener fit class is common for removable inspection panels?","back":"Class 1 (Clearance Fit)."},{"front":"Why must coolant be avoided when drilling composite materials?","back":"Composite materials can absorb liquids."},{"front":"What technique is used when drilling deep holes in steel to clear chips and prevent heat?","back":"Peck drilling."},{"front":"Surface Feet per Minute (SFM) is converted into _____ to set drill motor speeds.","back":"RPM (Revolutions Per Minute)"},{"front":"What is the result of using a drill bit with unequal cutting lips?","back":"The bit will drill an oversized hole."},{"front":"Proper storage guidelines state that bits should be kept dry and _____ to prevent corrosion.","back":"Lightly oiled"},{"front":"A thorough visual inspection of a bit includes checking the shank for deformation and _____ marks.","back":"Gripping"},{"front":"Which drilling defect results specifically from using the wrong bit or excessive feed rate in CFRP?","back":"Delamination."},{"front":"How do aircraft manufacturers define hole tolerances?","back":"They specify tolerances often within thousandths of an inch."},{"front":"Drill bits are sized by fractional inch, metric, and _____ systems.","back":"Wire gauge numbers"},{"front":"When inspecting cutting lips, they must be sharp and _____.","back":"Symmetrical"},{"front":"A reamer should always be rotated in the _____ only.","back":"Cutting direction"}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
