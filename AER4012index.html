<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4002flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>4002flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"Why is proper drill motor setup considered 'the job' in aircraft assembly rather than a preliminary step?","back":"It prevents compromised airframes and costly rework by ensuring holes are not oversized, off-center, or delaminated."},{"front":"What is the definition of a 'stack' in aircraft manufacturing?","back":"Two or more layers of material laid together and held in position for a common drilling operation."},{"front":"Why is drilling through a pre-assembled stack essential for structural integrity?","back":"It ensures all holes are co-axial across every layer for proper fastener fit and load transfer."},{"front":"Stack Configuration: Skin + Doubler","back":"Primary Function: Backs a thin outer skin with a thicker layer for reinforcement around joints or cutouts."},{"front":"Stack Configuration: Skin + Frame","back":"Primary Function: Lays fuselage or wing skin over a structural rib, requiring precise alignment to pre-marked locations."},{"front":"Stack Configuration: Multi-Layer Composite","back":"Primary Function: Layers carbon fiber or fiberglass with backing material to prevent delamination during drilling."},{"front":"What are Clecos used for in an assembly stack?","back":"They are temporary fasteners used to pull layers tightly together and maintain alignment during drilling."},{"front":"When are C-Clamps and Vise-Grips used instead of Clecos?","back":"Along edges or in areas where Clecos cannot reach to eliminate gaps between layers."},{"front":"What is the purpose of a Drill Jig or Template?","back":"To serve as a precision fixture that locates holes at exact positions and prevents bit drift."},{"front":"How are Clecos inserted into pilot holes?","back":"By using a specialized cleco plier to expand the internal spring mechanism."},{"front":"Stacking Step: Insert Clecos from the center outward","back":"Safety/Quality Purpose: To prevent buckling and trapped gaps within the stack."},{"front":"Which Cleco color corresponds to a $\\#40$ ($0.098$ inch) drill bit size?","back":"Silver"},{"front":"Which Cleco color corresponds to a $\\#30$ ($0.128$ inch) drill bit size?","back":"Copper / Bronze"},{"front":"Which Cleco color is used for $3/16$ inch structural holes?","back":"Black"},{"front":"Which Cleco color is used for $1/4$ inch heavy structural applications?","back":"Gold / Yellow"},{"front":"What is a visual indicator of an improper stack gap?","back":"Daylight visible between the material layers at the edges."},{"front":"What internal damage can occur if holes are drilled through a stack with gaps?","back":"Burrs form on interior surfaces that are impossible to deburr after fastener installation."},{"front":"What tool is used for precise gap measurement if required by a work order?","back":"Feeler gauge"},{"front":"What is the definition of 'alignment' in workpiece preparation?","back":"Ensuring all pre-marked hole locations, edges, and reference datums are in agreement before clamping."},{"front":"Step 2 of the Step-by-Step Stacking and Aligning process: _____","back":"Align Reference Edges and Datums"},{"front":"Step 4 of the Step-by-Step Stacking and Aligning process: _____","back":"Verify the Stack"},{"front":"What alignment error involves skipping available pilot holes?","back":"Skipped Pilot Holes, which leaves the stack under-constrained and reduces rigidity."},{"front":"Why are pneumatic drill motors preferred over electric drills in aerospace environments?","back":"They are lightweight, durable, and intrinsically safer in environments where flammable materials are present."},{"front":"What is the typical standard shop air pressure for aircraft pneumatic drills?","back":"$90$ PSI"},{"front":"What specific components must be checked on the drill motor during the inspection before every use?","back":"The air hose, chuck, and trigger must be checked for damage, wear, or leaks."},{"front":"Drill Motor Anatomy: Chuck","back":"Definition: The clamping mechanism at the front of the drill that grips the drill bit shank."},{"front":"Drill Motor Anatomy: Throttle Trigger","back":"Definition: The variable-pressure mechanism that controls motor speed and RPM."},{"front":"Drill Motor Anatomy: Air Inlet","back":"Definition: The quick-connect fitting where the compressed air supply hose attaches."},{"front":"Drill Motor Anatomy: Exhaust Port","back":"Definition: The opening that directs spent air away from the work surface and the operator's face."},{"front":"Which drill motor type is ideal for open-access drilling on skins and panels?","back":"Straight (Inline) Drill"},{"front":"Which drill motor type is used for confined spaces where a straight drill cannot reach?","back":"Angle (Right-Angle) Drill"},{"front":"What is the result of using air pressure that is too low?","back":"Reduced cutting speed, which can cause the drill bit to walk or bind."},{"front":"What is the danger of exceeding the rated PSI on a tool's data plate?","back":"It increases RPM beyond design limits, accelerating wear and risking bit breakage."},{"front":"Why must the drill be pointed away from people when connecting the air supply?","back":"An accidental trigger pull could eject an unsecured bit at high speed."},{"front":"Why is it forbidden to carry a pressurized drill by the hose?","back":"It risks disconnection, resulting in an uncontrolled whipping hose."},{"front":"What is the purpose of a pilot bit in aircraft assembly?","back":"To create an initial, precise hole that guides the final drill and prevents wandering."},{"front":"Twist Drill Geometry: Point Angle","back":"Definition: The angle of the cutting tip, often set to $135^{\\circ}$ in aircraft drills to reduce walking."},{"front":"Twist Drill Geometry: Flutes","back":"Definition: Helical grooves that channel material chips up and out of the hole."},{"front":"Twist Drill Geometry: Cutting Lips","back":"Definition: The two sharp edges at the drill tip responsible for removing material."},{"front":"What does bluing or discoloration on a drill bit indicate?","back":"The bit has overheated and must be removed from service."},{"front":"Why must a dull bit be removed from service immediately?","back":"It requires excessive pressure, produces oversized holes, and generates heat that damages materials."},{"front":"Which drill bit material is the standard choice for aluminum and soft metals?","back":"High-Speed Steel (HSS)"},{"front":"Why is Cobalt (HSS-Co) preferred for drilling stainless steel and titanium?","back":"It provides higher heat resistance required for hard structural components."},{"front":"Which bit material is used for carbon fiber composite (CFRP) to prevent delamination?","back":"Carbide-Tipped"},{"front":"What is the primary difference between a keyed and keyless chuck?","back":"Keyed chucks require a tool for maximum grip, while keyless chucks are hand-tightened for speed."},{"front":"Why is it dangerous to leave a chuck key in the drill while the air is connected?","back":"The key can become a dangerous projectile if the motor is accidentally triggered."},{"front":"Step 1 of the Step-by-Step Pilot Bit Installation process: _____","back":"Disconnect Air"},{"front":"Step 3 of the Step-by-Step Pilot Bit Installation process: _____","back":"Insert Shank"},{"front":"How should a drill bit shank be positioned within the chuck jaws?","back":"It must be slid in until it bottoms out against the back of the jaws and is centered."},{"front":"Why must you tighten a keyed chuck using all three key hole positions?","back":"To ensure even jaw seating and eliminate wobble or eccentricity (runout)."},{"front":"What is a 'Wobble Check' during installation verification?","back":"Briefly running the motor at low throttle to ensure the tip does not visibly oscillate."},{"front":"What is the maximum Total Indicator Reading (TIR) for bit runout in precision applications?","back":"$0.003$ inches"},{"front":"Why is gripping a drill bit on its flutes forbidden?","back":"Flutes cannot withstand lateral jaw forces and will be crushed, causing imbalance and ruinous runout."},{"front":"What happens if a bit is only 'hand tight' in a heavy-duty chuck?","back":"The bit will spin within the jaws under load, scoring the shank and ruining the chuck bore."},{"front":"What is the recommended RPM and pressure for drilling Aluminum Alloy?","back":"High RPM with consistent light pressure."},{"front":"Why is low RPM and high feed pressure required for drilling Titanium?","back":"Titanium work-hardens rapidly; a rubbing bit will harden the surface and stop cutting."},{"front":"What technique prevents exit-side breakout when drilling Carbon Fiber (CFRP)?","back":"Using a backup plate behind the stack."},{"front":"What is the standard diameter tolerance for a quality pilot hole?","back":"$\\pm 0.003$ inches"},{"front":"What is the likely cause of an egg-shaped or oversized hole?","back":"Bit runout or side pressure applied by the operator during drilling."},{"front":"What is the corrective action for a hole that wandered off-location?","back":"Use a $135^{\\circ}$ split-point bit and start the hole at low throttle."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
