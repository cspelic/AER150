<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AER4013FC — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AER4013FC</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"Term: Pilot Hole","back":"Memory: Lead the Way (An initial small-diameter hole used to guide and locate the final hole accurately)."},{"front":"Term: Drill Stop","back":"Memory: The Brakes (A collar attached to a drill bit shank to limit drilling depth to a preset measurement)."},{"front":"Term: Burr","back":"Memory: Edge of Danger (A raised, sharp projection of metal left around a hole rim after drilling)."},{"front":"Term: Deburring","back":"Memory: Finish the Job (The process of removing sharp edges to create a smooth hole safe for fasteners)."},{"front":"Term: Go/NoGo Gauge","back":"Memory: The Judge (A precision pin tool used to verify that a hole diameter is within tolerance)."},{"front":"Term: Open Countersink","back":"Memory: Manual Touch (A cone-shaped handheld tool used to lightly chamfer and deburr hole rims)."},{"front":"Term: Runout","back":"Memory: Visual Wobble (The eccentricity or wobble of a spinning drill bit that causes oversized holes)."},{"front":"Term: Faying Surfaces","back":"Memory: Sandwich Faces (The mating faces between two structural members that are joined together)."},{"front":"Which safety inspection metric is checked by briefly running the drill at low speed after bit installation?","back":"Bit runout (visually observing the tip for any blurry motion or wobble)."},{"front":"What safety inspection should be performed on a drill bit before it is used to drill a hole?","back":"Check for physical defects such as chips, cracks, or dull cutting edges."},{"front":"What specific safety metric must be inspected on a drill stop collar before use?","back":"Verify the collar face is free of nicks or burrs that could cause it to tilt."},{"front":"What are the criteria for passing a Go/NoGo gauge inspection?","back":"The Go end must enter the hole under its own weight, while the NoGo end must not enter."},{"front":"Why is precision in hole quality essential for aircraft fasteners?","back":"Poorly drilled holes can compromise the structural integrity of the entire aircraft."},{"front":"What is the general rule of thumb for selecting a pilot bit size relative to the final hole?","back":"The pilot bit should be roughly $\\frac{1}{3}$ to $\\frac{1}{2}$ the diameter of the final hole."},{"front":"What safety risk is associated with drilling into composites without respiratory protection?","back":"Composite drilling generates hazardous fine particulates and dust."},{"front":"How does using a pilot hole prevent drill bit 'walk' or 'wander'?","back":"It provides a precise starting centerline to guide the larger, harder-to-control bit."},{"front":"Which specific PPE is required because pneumatic drills exceed safe noise levels?","back":"Earplugs or earmuffs rated for the specific shop environment."},{"front":"What is the danger of holding a workpiece with bare hands during drilling?","back":"The bit may grab the material and cause injury; always use clamps or fixtures."},{"front":"Why must a technician power down and lock out a drill before swapping bits?","back":"To prevent accidental trigger activation while handling the chuck or sharp bit."},{"front":"What are the four primary steps for drilling a pilot hole?","back":"Secure (clamp), Mark (center punch), Drill (apply pressure), and Withdraw (clear chips)."},{"front":"What symptom indicates the drill feed rate is too fast?","back":"Bit chatter, rough hole walls, or possible snapping of the drill bit."},{"front":"What symptom indicates the drill feed rate is too slow?","back":"Work hardening of the metal, excess heat, and bit rubbing rather than cutting."},{"front":"Which drilling parameters are recommended for aluminum?","back":"Higher RPM and the use of light cutting fluid."},{"front":"Which drilling parameters are recommended for titanium?","back":"Low RPM and the use of heavy cutting fluid."},{"front":"In a keyed drill chuck, how many positions should be tightened to ensure even clamping?","back":"All three key positions around the chuck should be tightened securely."},{"front":"What is the risk of using a drill bit with known runout?","back":"It will produce oversized or out-of-round holes that fail quality inspection."},{"front":"How does a drill stop prevent damage to internal aircraft structures?","back":"It stops the bit before it can hit hidden components like wiring or sealant behind the panel."},{"front":"At what point on the drill bit should the depth be measured when setting a drill stop?","back":"Depth must be measured from the tip of the cutting edge."},{"front":"What is the consequence of a drill stop set even $\\frac{1}{16}$ inch too deep?","back":"It can cause over-drilling defects that may require scrapping an expensive part."},{"front":"Why is steady, consistent pressure required when enlarging a pilot hole?","back":"Inconsistent pressure leaves chatter marks on the hole wall that affect fastener seating."},{"front":"What is the purpose of applying 'Boelube' or cutting fluid before each hole?","back":"It reduces heat buildup and extends the service life of the drill bit."},{"front":"Why is it necessary to withdraw the drill bit periodically during the cut?","back":"To clear chips from the flutes and prevent the bit from seizing due to heat."},{"front":"What is a 'material stack' in aircraft assembly?","back":"Multiple layers of material, such as skin, shims, and spars, clamped and drilled together."},{"front":"What rule prevents inter-layer burrs when drilling through a material stack?","back":"All layers must be clamped tightly together with no relative movement during drilling."},{"front":"What should a technician do if a drill bit feels loose in the chuck after swapping?","back":"Stop work, power down, re-seat the bit, and check for runout."},{"front":"What does a failed Go pin test (pin will not enter) indicate?","back":"The hole is undersize and must be re-drilled with the correct bit."},{"front":"What does a failed NoGo pin test (pin enters the hole) indicate?","back":"The hole is oversize and may require formal repair or part replacement."},{"front":"Why must chips be cleaned out of a hole before using a Go/NoGo gauge?","back":"Debris inside the hole can cause a false rejection reading."},{"front":"In regulated aviation, what is a hole that fails inspection officially called?","back":"A nonconformance, which is a documented quality defect."},{"front":"How are burrs formed during the drilling process?","back":"The cutting action displaces metal at the edge rather than cutting it cleanly as the bit exits."},{"front":"How do burrs lead to fatigue cracking in aircraft structures?","back":"They prevent fasteners from seating flush, creating dangerous stress concentrations."},{"front":"Why should deburring only be performed by hand rather than with a power drill?","back":"Power drills remove material too quickly and can create structural defects by over-countersinking."},{"front":"What is the recommended number of rotations for deburring a hole with an open countersink?","back":"One to two light rotations by hand is typically sufficient."},{"front":"What is the 'fingernail test' in the deburring process?","back":"Running a fingernail around the rim to ensure it does not catch on any remaining burrs."},{"front":"Which side of a drilled hole typically produces a larger burr?","back":"The exit side of the hole often has a larger burr than the entry side."},{"front":"What is the standard procedure for deburring faying surfaces in a stack?","back":"Separate the layers after pilot drilling and deburr the interior faces individually."},{"front":"According to the FAA-aligned workflow, what is the fourth stage of the complete hole process?","back":"Enlarge the hole to final size."},{"front":"According to the FAA-aligned workflow, what is the sixth and final stage of the hole process?","back":"Deburr faces and verify with a fingernail test."},{"front":"What is a Production Approval Holder (PAH)?","back":"A company with FAA approval to manufacture aircraft parts using documented quality procedures."},{"front":"What is the purpose of a First Article Inspection?","back":"A complete dimensional inspection of the first part produced to ensure it meets the design."},{"front":"What is the ethical obligation of a technician when a teammate suggests hiding a defect?","back":"Personal integrity and professional obligation to report defects must always override social pressure."},{"front":"Why is traceability required for every hole drilled in FAA-regulated production?","back":"It ensures accountability and safety records throughout the manufacturing process."},{"front":"What creates the risk of a fastener shank resting against a sharp edge and concentrating stress?","back":"Skipping the deburring step on the exit side of the hole."},{"front":"What effect does a dull open countersink have on the material?","back":"It rubs and burnishes the metal rather than cutting, creating heat and uneven edges."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
