<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AER4015flashcards (4) — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AER4015flashcards (4)</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"Why is a perfectly flush rivet critical for aircraft flying at 30,000 feet?","back":"It minimizes aerodynamic drag and prevents structural stress concentration points."},{"front":"Term: Countersink","back":"Definition: A conical recess cut into a material surface so that a fastener head sits flush with or below the surface."},{"front":"Term: Countersink Cutter","back":"Definition: A specialized rotating tool used to create the angled countersink recess, typically at $100^{\\circ}$ or $82^{\\circ}$."},{"front":"Term: Federal Gauge","back":"Definition: A precision dial-indicator instrument used to verify that countersink diameter and depth meet engineering tolerances."},{"front":"Term: Flush Fastener","back":"Definition: A rivet or screw whose head sits level with the surrounding material surface to support aerodynamics and structural loading."},{"front":"Term: Scrap Assembly","back":"Definition: A test piece of the same material stack-up used to verify tool setup before working on final parts."},{"front":"Term: Final Assembly","back":"Definition: The actual aircraft structural component where approved countersinks are applied after scrap verification."},{"front":"Term: Tolerance","back":"Definition: The allowable variation in a dimension, which in aviation is often within $\\pm 0.002$ inches."},{"front":"Term: Depth Stop","back":"Definition: A mechanical stop on a countersink cage or drill motor that limits how deep the cutter can penetrate."},{"front":"In the countersink workflow, what must be consulted before picking up any tool?","back":"The engineering order (EO) or work instruction."},{"front":"Which countersink angle is the most common in commercial aircraft manufacturing?","back":"$100^{\\circ}$"},{"front":"What is the primary application for $82^{\\circ}$ countersinks in aviation?","back":"Certain screws and specific fastener systems."},{"front":"What is the primary benefit of using a single-flute countersink cutter?","back":"It produces a very smooth finish on visible aerodynamic surfaces."},{"front":"What is the main drawback of using a multi-flute countersink cutter?","back":"It requires more attention to chatter and surface finish quality."},{"front":"What is the standard tool for precision countersinking in aircraft production?","back":"The microstop cage."},{"front":"Component: Pilot Pin","back":"Function: It centers the cutter in the pre-drilled hole to prevent off-center or oval countersinks."},{"front":"How do you adjust a microstop cage depth adjustment ring to create a deeper recess?","back":"Turn the threaded collar clockwise."},{"front":"How much depth change does one graduation on a typical microstop cage adjustment ring represent?","back":"$0.001$ inch"},{"front":"What is the purpose of the locking collar on a microstop cage?","back":"It prevents the depth setting from drifting during operation."},{"front":"Why must the nose piece of a microstop cage be kept clean?","back":"To prevent scratches on the workpiece and ensure the cage does not rock during use."},{"front":"Why is scrap verification considered non-negotiable in aircraft manufacturing?","back":"It catches setup errors and shifts in tool depth before they become nonconforming parts on the final assembly."},{"front":"What must the scrap assembly replicate to ensure a valid test result?","back":"The exact material alloy, thickness, and layer stack-up of the final part."},{"front":"Outline the first step for countersinking on a scrap piece.","back":"Position the cage by placing the pilot into the hole while holding the drill perpendicular to the surface."},{"front":"Outline the second step for countersinking on a scrap piece.","back":"Apply light, steady, even feed pressure without forcing the cutter."},{"front":"Outline the third step for countersinking on a scrap piece.","back":"Allow the stop to bottom out against the surface, hold for one full second, and then retract."},{"front":"Outline the final step for countersinking on a scrap piece.","back":"Clear chips with compressed air and visually inspect the hole for roundness and smoothness before measuring."},{"front":"What is the typical pneumatic drill speed range for countersinking aluminum?","back":"$1,500$ to $3,000$ RPM."},{"front":"What are the primary consequences of setting the drill motor speed too fast?","back":"Heat buildup, chatter marks, and premature cutter wear."},{"front":"What are the primary consequences of setting the drill motor speed too slow?","back":"Rough surface finish, excessive feed force requirements, and uneven hole diameter."},{"front":"What is the specific risk of countersinking composite materials without lubrication?","back":"Delamination of the material layers."},{"front":"Component: Conical Gauge Pin","back":"Function: It seats inside the countersink to translate geometry into a measurement reading on the dial."},{"front":"Component: Reference Foot","back":"Function: It rests flat on the workpiece to provide a consistent datum for measurement."},{"front":"How does a Federal gauge determine if a countersink is too deep?","back":"The conical pin drops lower than the master standard, resulting in a negative reading."},{"front":"What is the first step in zeroing a Federal countersink gauge?","back":"Select a certified master standard that matches the angle and nominal size of the countersink."},{"front":"How is the reference point set during the zeroing of a Federal gauge?","back":"By rotating the dial bezel until the needle points to zero while seated in the master standard."},{"front":"What does a reading of zero ($0$) on a Federal gauge indicate?","back":"The countersink is exactly the same size as the master, meaning the fastener will sit perfectly flush."},{"front":"On a Federal gauge, what does a positive ($+$) reading indicate about the countersink?","back":"The countersink is smaller than the master (too shallow), causing the fastener head to protrude."},{"front":"On a Federal gauge, what does a negative ($-$) reading indicate about the countersink?","back":"The countersink is larger than the master (too deep), causing the fastener head to sit below the surface."},{"front":"Why is a too-deep countersink typically cause for rejection?","back":"It is an irreversible condition because material cannot be added back to the hole."},{"front":"What is the typical tolerance range for countersink depth relative to nominal in aircraft engineering?","back":"$+0.004$ inches to $-0.006$ inches."},{"front":"Defect: Chatter Marks","back":"Structural Consequence: Results in poor fastener seating due to concentric ring patterns on the surface."},{"front":"Defect: Rub-Out","back":"Structural Consequence: Often non-reworkable; may require an oversized fastener or complex repair scheme."},{"front":"Defect: Off-Center Countersink","back":"Structural Consequence: Creates uneven fastener loading, which poses a structural integrity concern."},{"front":"Defect: Torn or Burred Edge","back":"Structural Consequence: Creates rough material that interferes with fastener installation and must be deburred."},{"front":"Why is it important to follow the hole pattern sequence specified in the engineering order?","back":"It ensures consistency and prevents missed or mislocated countersinks."},{"front":"How often should a technician gauge holes during final assembly production?","back":"Every $5^{th}$ or $10^{th}$ hole, as specified by the facility work instruction."},{"front":"What is the most common aircraft rivet size for primary skin attachment?","back":"$1/8$ inch ($0.125$ inches)."},{"front":"Which rivet size is typically used for small interior brackets and light skin panels?","back":"$3/32$ inch ($0.094$ inches)."},{"front":"Which rivet size is used for heavier structural applications like frames and doublers?","back":"$5/32$ inch ($0.156$ inches)."},{"front":"What type of PPE is required to protect against razor-sharp aluminum chips ejected at high velocity?","back":"ANSI-rated safety glasses or a face shield."},{"front":"At what decibel level is hearing protection required on the shop floor?","back":"$85$ dB."},{"front":"When are cut-resistant gloves required while countersinking?","back":"When handling freshly countersunk panels or parts to prevent lacerations."},{"front":"What PPE is mandatory when countersinking composite materials to protect against carbon fiber particles?","back":"An appropriate dust mask or respirator."},{"front":"What is the FAA-mandated process for documenting and tracking nonconforming countersinks?","back":"The Material Review Board (MRB) process."},{"front":"What does a technician's signature on a countersink operation legally attest?","back":"That the operation meets all engineering requirements and the part is airworthy."},{"front":"Scenario: A Federal gauge reading drifts to $-0.005$ inches at the $10^{th}$ hole. Action?","back":"Stop immediately, re-zero the gauge, and reverify the depth setting on scrap before proceeding."},{"front":"Scenario: A countersink is visually elliptical but the depth reading is within tolerance. Action?","back":"Stop work and notify quality inspection; never install a fastener without engineering disposition."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
