<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AER4022flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AER4022flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"Component: Hi-Lok Fastener","back":"A high-strength, two-piece aerospace fastener used for permanent structural joints."},{"front":"Component: Hi-Lok Collar","back":"A nut-like locking ring that threads onto the pin and locks in place during installation."},{"front":"Component: Shank (Pin)","back":"A hardened threaded bolt that passes through the material stack to be secured by a collar."},{"front":"Where is the hex recess located on a Hi-Lok fastener?","back":"It is located on the head end of the pin (shank)."},{"front":"Tool: Hi-Lok Collar Pliers","back":"Specially designed tools with shaped jaws to grip and break collars without slipping."},{"front":"Tool: Pin Punch","back":"A hardened steel tool used to drive the shank out of a hole after the collar is removed."},{"front":"Tool: Ball Peen Hammer","back":"A machinist's hammer used to strike a pin punch with controlled force during removal."},{"front":"What is the specific tool requirement for a 5/16 inch Hi-Lok removal task?","back":"Collar pliers and a pin punch must be sized specifically for $5/16$ inch diameter."},{"front":"Why must every fastener removal be performed correctly in aircraft manufacturing?","back":"To maintain structural integrity and prevent damage to the surrounding skin or hole."},{"front":"When inspecting collar pliers, what should be checked regarding jaw surfaces?","back":"Ensure they are clean and free of any debris."},{"front":"When inspecting collar pliers, what should be checked regarding mechanical movement?","back":"Confirm the jaws open and close smoothly with no binding."},{"front":"When inspecting collar pliers, what physical damage should be checked for on the jaw tips?","back":"Look for any cracks, chips, or deformation."},{"front":"What must be verified regarding the strike end of a pin punch before use?","back":"It must be straight and show no signs of mushrooming."},{"front":"What diameter must the pin punch match for a successful removal?","back":"The punch diameter must match the Hi-Lok shank diameter exactly."},{"front":"When inspecting a ball peen hammer, what should be verified regarding the head?","back":"The head must be secure with no wobble on the handle."},{"front":"What handle condition should be checked for when inspecting striking tools?","back":"The handle must be free of cracks and splinters."},{"front":"What is Phase 1 of the Hi-Lok removal process?","back":"Gripping and removing the collar."},{"front":"What is Phase 2 of the Hi-Lok removal process?","back":"Driving out the shank."},{"front":"Why is the order of removal phases (Collar then Shank) critical?","back":"Attempting to drive the shank before removing the collar will destroy the hole."},{"front":"What is the required orientation for seating collar pliers on a collar?","back":"The jaw opening must align with the collar to allow full leverage without interference."},{"front":"What jaw engagement is required to prevent slippage during collar removal?","back":"The jaws must engage the full circumference of the collar, not just the edge."},{"front":"What must the technician verify visually before squeezing the collar pliers?","back":"Jaws must be centered on the collar and not contacting the aircraft skin."},{"front":"What type of pressure should be applied to the collar pliers handles?","back":"Firm, continuous squeezing pressure without jerking or twisting."},{"front":"What sensory indicator signals that the collar has broken free from the threads?","back":"A distinct pop or snap sound."},{"front":"Why is a twisting motion prohibited when using collar pliers?","back":"Twisting can break jaw tips and create dangerous flying metal fragments."},{"front":"Where should the pin punch be placed during the start of Phase 2?","back":"Squarely on the center of the shank head."},{"front":"At what angle must the pin punch be held relative to the material surface?","back":"It must be held perpendicular at $90^{\\circ}$."},{"front":"What is the consequence of holding a pin punch at an angle during striking?","back":"The punch may deflect off the fastener and damage the skin material."},{"front":"Which hand should hold the ball peen hammer for maximum control?","back":"The dominant hand should hold it near the end of the handle."},{"front":"Which part of the ball peen hammer is used to strike the pin punch?","back":"The flat face of the hammer."},{"front":"Why is a rubber mallet prohibited for driving out Hi-Lok shanks?","back":"It does not deliver enough energy to drive the shank out cleanly."},{"front":"How often should punch alignment be checked during the striking process?","back":"Alignment should be re-checked after every 2 to 3 strikes."},{"front":"What action should be taken as the shank nears the exit point of the hole?","back":"The technician must reduce strike force and catch the shank."},{"front":"What is a major risk of a free-falling shank during removal?","back":"It can gouge or dent the opposite surface of the aircraft part."},{"front":"What PPE is required whenever striking tools are in use?","back":"Safety glasses and work gloves."},{"front":"Why must work gloves be worn during Hi-Lok removal?","back":"To protect the non-dominant hand from missed strikes and improve grip on the punch."},{"front":"What is the bystander safety rule for Hi-Lok removal?","back":"Ensure no other people are within the strike zone due to unpredictable fragment travel."},{"front":"What should a technician do if the punch slips and contacts the aircraft skin?","back":"Stop immediately, inspect for damage, and report it to a supervisor."},{"front":"What is the purpose of using wood or plastic backup blocks?","back":"They protect the opposite surface of thin or unsupported panels as the shank exits."},{"front":"What is the correct response if a shank remains stuck after several controlled strikes?","back":"Stop striking and consult an instructor or supervisor to avoid enlarging the hole."},{"front":"Why is a 'mushroomed' punch considered a serious safety hazard?","back":"The deformed metal can shear off and become a high-velocity projectile."},{"front":"What is the first step when a missing collar fragment is suspected?","back":"Stop all work and declare an FOD event to a supervisor immediately."},{"front":"Definition: FOD","back":"Foreign Object Debris; loose items inside an aircraft that can jam controls or damage lines."},{"front":"If the assembly shifts during removal, what is the 'Right Call' procedure?","back":"Stop striking, re-secure the part, and verify punch alignment before continuing."},{"front":"In what aircraft assembly area are Hi-Loks used to maintain a pressurized cabin?","back":"Fuselage skin panels."},{"front":"Why are Hi-Loks used in wing assemblies?","back":"To join skins, spars, and ribs that must withstand high shear and tension loads."},{"front":"Why are Hi-Loks used in door surround structures?","back":"To maintain tight tolerances and resist repeated pressure cycles during flight."},{"front":"What is a common reason for removing a Hi-Lok in an MRO environment?","back":"To replace a fastener found to be cracked, corroded, or improperly installed."},{"front":"Why might a fastener be removed for 'Structural Rework'?","back":"A design change requires access to the underlying structure."},{"front":"What reason for removal involves checking for cracks or fatigue in underlying frames?","back":"Access for inspection."},{"front":"What must be documented regarding the reason for a fastener's removal?","back":"The specific nonconformance or rework order requirement."},{"front":"What technician information is required in the removal quality record?","back":"The technician's name and employee number."},{"front":"What post-removal inspection result must be recorded in the quality system?","back":"The final condition of the hole."},{"front":"The _____ shears off when the correct installation torque is reached on a Hi-Lok collar.","back":"wrenching element"},{"front":"To prevent 'False Positives' during removal, the technician should re-center the punch after the assembly _____.","back":"shifts"},{"front":"The goal of striking the shank is _____, not speed.","back":"control"},{"front":"Using excessive strike force on a stuck shank can lead to a _____ hole.","back":"oversized (or elongated)"},{"front":"FAA-aligned training programs require that technician work on aircraft be traceable through a _____.","back":"paper trail (or documentation)"},{"front":"What is the recommended response if collar pliers slip but the skin is unmarked?","back":"Reposition the pliers for better jaw engagement and try again."},{"front":"What is the recommended action if a collar is made of an unusual alloy and won't break?","back":"Escalate the issue to an instructor or supervisor."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
