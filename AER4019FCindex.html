<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AER4019FC — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AER4019FC</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"What are the two distinct components that make up a Hi-Lok aerospace fastener?","back":"A threaded pin and a mating collar."},{"front":"Which specific Hi-Lok component is designed to provide a consistent clamp-up force and resist vibration loosening?","back":"The mating collar."},{"front":"What is the primary advantage of the Hi-Lok system regarding personnel requirements during assembly?","back":"It is installable by a single operator."},{"front":"What feature is typically found in the tip of a Hi-Lok pin to prevent it from rotating during installation?","back":"A hex socket wrenching recess."},{"front":"How does a Hi-Lok collar ensure the correct installation torque is achieved without using a torque wrench?","back":"The hexagonal wrenching section shears off automatically."},{"front":"Where are countersunk (flush) Hi-Lok heads required for aircraft structural applications?","back":"Aerodynamic surfaces like wing skins and fuselage panels."},{"front":"In what aircraft areas are protruding head Hi-Lok fasteners typically used?","back":"Structural areas where aerodynamic smoothness is not required."},{"front":"Which tool is used to drive and seat the Hi-Lok pin through the structure?","back":"Standard rivet gun."},{"front":"What tool is used for Hi-Lok installation in tight bay or deep pocket areas where pneumatic tools cannot reach?","back":"Manual torque tool."},{"front":"Which tool is the preferred production method for fast and repeatable Hi-Lok collar installation?","back":"Pneumatic torque tool."},{"front":"What is the primary function of the gap inspection shim?","back":"To verify flush seating of the fastener head against the structure."},{"front":"What dimension does a pin protrusion gauge verify on the collar side?","back":"Correct thread engagement."},{"front":"To what precision must a hole be prepared for a $\\frac{3}{16}$ inch Hi-Lok fastener?","back":"It must be drilled and reamed to a precise diameter tolerance."},{"front":"What must be used to verify that a hole diameter is within engineering specifications before installation?","back":"A calibrated pin gauge or hole gauge."},{"front":"Besides diameter, what hole quality characteristics must be inspected using a bright light?","back":"Roundness, absence of burrs, and no visible cracks or delamination."},{"front":"Why is it mandatory to deburr every hole before Hi-Lok installation?","back":"Burrs can prevent the fastener head from seating flush and create stress concentrations."},{"front":"When deburring a hole, which side(s) of the structure must be treated?","back":"Both the near side (head side) and far side (collar side)."},{"front":"What is the correct action regarding metal chips after deburring but before pin insertion?","back":"The chips must be wiped away."},{"front":"Selection of the correct Hi-Lok part number must be made from the _____.","back":"Engineering bill of materials (BOM)."},{"front":"What tool is used to measure the total stack thickness to select the proper Hi-Lok grip range?","back":"A grip gauge or depth micrometer."},{"front":"What should be done with a selected Hi-Lok pin or collar if it shows signs of corrosion or thread damage?","back":"It must be rejected and quarantined."},{"front":"In the context of Hi-Lok installation, what is 'wet installation'?","back":"Coating the fastener with an approved sealant or corrosion inhibitor before insertion."},{"front":"What constraint must be observed when preparing sealant for fastener application?","back":"Pot life limitations."},{"front":"Where should sealant be uniformly applied on the Hi-Lok pin?","back":"On the shank and the underside of the pin head."},{"front":"How much force should be required to slide a Hi-Lok pin through the structural hole?","back":"Light hand pressure."},{"front":"What is the mandatory first step when beginning the installation of the Hi-Lok collar?","back":"Starting the collar by hand."},{"front":"What is the minimum thread engagement required when hand-starting a Hi-Lok collar?","back":"Two full threads."},{"front":"Why must a torque tool never be applied to a collar that hasn't been hand-started?","back":"To prevent cross-threading which damages the pin and the structure."},{"front":"What is the purpose of using a rivet gun once the collar is hand-started?","back":"To fully drive the pin head against the structure and close stack gaps."},{"front":"To avoid deforming the pin head, how should the rivet gun trigger be operated?","back":"In short, controlled bursts."},{"front":"A Hi-Lok pin head is fully seated when it contacts the surface evenly with no _____.","back":"Visible rocking or gap."},{"front":"What risk is associated with an incorrectly configured pneumatic torque tool?","back":"It can under-torque the collar or over-stress the pin."},{"front":"What must be verified on a pneumatic torque tool before production use if it is past its calibration interval?","back":"Nothing; it must be removed from service immediately."},{"front":"Why is full socket engagement essential when applying a pneumatic tool to a Hi-Lok collar?","back":"Partial engagement can slip and round off the hex wrenching feature."},{"front":"What alignment should the tool maintain relative to the fastener axis during torque application?","back":"In line with the fastener axis (no angling)."},{"front":"Define 'the break-off' in the Hi-Lok installation process.","back":"The clean shearing of the collar's hex wrenching section at the design torque."},{"front":"What visual evidence indicates a completed Hi-Lok break-off?","back":"The hex section falls away, leaving only the collar body on the pin."},{"front":"Condition: The hex section shears cleanly at the designed groove location and the collar is flush. Result?","back":"Conforming break-off."},{"front":"What does a partial break-off, where hex material remains on the collar, indicate about the installation?","back":"Incorrect torque was applied and the installation must be rejected."},{"front":"What does 'collar spin-off' indicate during the installation process?","back":"The collar was not properly engaged or the pin threads were damaged."},{"front":"Under what condition is sampling permitted when inspecting structural Hi-Lok fasteners?","back":"Sampling is never permitted; 100 percent of fasteners must be inspected."},{"front":"Inspection Step: Verify the head is fully seated with no gap against the near-side surface (Hint: Hi-Lok Pin).","back":"Gap inspection shim"},{"front":"In gap shim inspection, what result indicates a conforming head installation?","back":"The shim cannot be inserted anywhere around the head perimeter."},{"front":"What is the minimum number of positions around a fastener head that must be checked with a gap shim?","back":"Four positions (12, 3, 6, and 9 o'clock)."},{"front":"Besides gaps, what else must countersunk heads be checked for using the gap shim?","back":"Being proud of the flush surface."},{"front":"How can a burr on the near-side hole edge cause a gapped head rejection?","back":"The burr acts as a standoff, preventing the head from contacting the structure."},{"front":"What is the consequence of structural layers not being clamped or cleco'd before fastener installation?","back":"A gap may remain in the stack that the fastener cannot close."},{"front":"Inspection Step: Confirm that the pin extends through the collar by the correct amount (Hint: Hi-Lok Collar).","back":"Pin protrusion gauge"},{"front":"Why is insufficient thread engagement through the collar a rejectable condition?","back":"It reduces the fastener's ability to carry design loads and may cause stripping."},{"front":"In protrusion inspection, what is the required behavior of the 'Go' end of the gauge?","back":"It must pass over the pin tip without interference."},{"front":"What does it mean if the 'No-Go' end of a protrusion gauge passes over the pin tip?","back":"Insufficient protrusion and inadequate thread engagement."},{"front":"A 'Go' end failure on the protrusion gauge indicates the pin grip length was too _____.","back":"Short."},{"front":"What should an operator do if a Hi-Lok installation fails either the gap shim or protrusion gauge check?","back":"Stop work at that location and initiate a non-conformance report (NCR)."},{"front":"Which engineering disposition means that structural analysis supports accepting a non-conforming fastener as it is?","back":"Use As Is."},{"front":"Which engineering disposition means a repair is possible within design limits?","back":"Rework."},{"front":"How should a Hi-Lok collar be removed when engineering mandates rework?","back":"By drilling it out with a bit sized only for the collar to avoid touching the pin."},{"front":"What tool is used to drive the Hi-Lok pin out of the hole after collar removal?","back":"A drift punch sized to fit inside the collar ID."},{"front":"Why should an oversized drill never be used for Hi-Lok collar removal?","back":"It enlarges the hole beyond allowable tolerances, requiring structural repair."},{"front":"What specific safety equipment protects against metal chips and collar break-off fragments?","back":"Safety glasses or goggles."},{"front":"Why must operators wear hearing protection when working with rivet guns and pneumatic tools?","back":"To prevent cumulative noise-induced hearing loss."},{"front":"What is the primary hand safety concern during pneumatic torque tool operation?","back":"Controlling the tool firmly during the sudden torque release at break-off."},{"front":"Where can an operator find hazard and PPE information for aircraft sealants?","back":"Safety Data Sheet (SDS)."},{"front":"Cloze: Order matters in installation; the pin must be hand-started before applying any _____.","back":"Torque tool"},{"front":"True or False: The manual torque tool provides an audible click when the hex breaks off.","back":"True"},{"front":"What is the purpose of testing a tool on a practice assembly after calibration?","back":"To verify proper operation before installing on flight structure."},{"front":"Formula: Conforming Protrusion = (Go End Passes) + (No-Go End _____).","back":"Does Not Pass"},{"front":"What does a 'Reject/Scrap' engineering disposition mean for the affected structure?","back":"The structure must be replaced."},{"front":"How should a non-conforming fastener location be marked to prevent it from being overlooked?","back":"Marked clearly."},{"front":"What determines the correct rivet set choice for a standard rivet gun?","back":"The pin head profile (flat, countersunk, or cupped)."},{"front":"Term: Hi-Lok Grip Range.","back":"Definition: The specific range of material stack thickness a given pin length can properly accommodate."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
