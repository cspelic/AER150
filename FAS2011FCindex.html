<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAS2011flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>FAS2011flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"What is the primary mindset of a safety-conscious aviation professional?","back":"Constantly asking what could happen if a fastener fails at 30,000 feet."},{"front":"Force: Torsion","back":"Mechanical Failure: Gradual unscrewing of fasteners connected to rotating components over time."},{"front":"Force: Cyclical Tension","back":"Mechanical Failure: Fastener \"walking\" loose due to the building and releasing of pulling forces."},{"front":"Force: Vibration","back":"Mechanical Failure: Fasteners working loose within hours of operation without positive locking."},{"front":"Which force specifically affects fasteners on engines and propellers?","back":"Torsion"},{"front":"What environmental factor creates constant vibration throughout an airframe?","back":"Aerodynamic airflow"},{"front":"What is the consequence of a failed fastener in a flight-critical system?","back":"Potential loss of aircraft control."},{"front":"Which three areas are examples of flight-critical systems requiring positive locking?","back":"Control surfaces, landing gear, and engine mounts."},{"front":"The FAA requirement for all flight-critical fasteners is _____.","back":"Positive locking"},{"front":"Term: Torsion","back":"A twisting force applied to a fastener or structural component during operation."},{"front":"Term: Tension","back":"A pulling force stretching a fastener along its axis, resisting the separation of joined parts."},{"front":"Term: Lockwire","back":"Soft, corrosion-resistant wire threaded through fasteners to prevent rotation and loosening."},{"front":"Term: Castellated Nut","back":"A nut with slots cut into its top designed to accept a cotter pin for positive locking."},{"front":"Term: Cotter Pin","back":"A split metal pin inserted through a castellated nut and bolt hole to prevent nut rotation."},{"front":"Why is positive locking considered a mandatory step in aircraft assembly?","back":"It ensures loosening is detectable during inspection and prevents rotation without defeating the mechanism."},{"front":"FAA Safety-Critical System: Engine, fuel, and flight-critical fittings","back":"Primary Locking Method: Lockwire"},{"front":"FAA Safety-Critical System: Landing gear and control linkages","back":"Primary Locking Method: Cotter pin with castellated nut"},{"front":"FAA Safety-Critical System: Structural bolts requiring positive visual locking confirmation","back":"Primary Locking Method: Tab (Keyed) lock washer"},{"front":"What locking method is best suited for lower-vibration secondary structures?","back":"Nylon-insert nuts (Nyloc)"},{"front":"Which securing method is appropriate for adjustable threaded connections like rod ends?","back":"Jam nuts"},{"front":"What is the primary material used for lockwire?","back":"Soft, annealed stainless steel wire."},{"front":"List the three common diameters for safety wire in aviation.","back":"$0.020\"$, $0.032\"$, and $0.041\"$."},{"front":"Which FAA Advisory Circular governs the requirement for lockwire?","back":"AC 43.13-1B"},{"front":"In what direction must lockwire be twisted to be effective?","back":"So that any tendency for the fastener to loosen will instead tighten the wire."},{"front":"What is the common nickname for lockwire pliers?","back":"Twister pliers"},{"front":"Lockwire Pliers component: Jaws / Wire Grip","back":"Function: Clamping both strands of wire securely to prevent slipping under tension."},{"front":"Lockwire Pliers component: Pulling Handle / Barrel","back":"Function: Applying tension to the wire before the twisting process begins."},{"front":"Lockwire Pliers component: Ratchet / Spin Mechanism","back":"Function: Rotating the tool to create an even pigtail twist pattern."},{"front":"Lockwire Pliers component: Lock Button","back":"Function: Releasing the jaws to remove the tool without disturbing the installation."},{"front":"What is the required twist rate for a properly installed safety wire?","back":"6–8 twists per inch."},{"front":"What happens to safety wire if it is over-twisted?","back":"The wire becomes brittle and may break."},{"front":"Define: FOD","back":"Foreign Object Damage or Debris."},{"front":"When cutting lockwire, what is the maximum allowable length for the pigtail tail?","back":"One-half inch ($0.5\"$)."},{"front":"Where should a safety wire pigtail be positioned after trimming?","back":"Folded flat against the fastener to prevent snagging and FOD."},{"front":"What professional responsibility must a technician fulfill after every lockwiring job?","back":"Perform a FOD sweep of the work area."},{"front":"Why is a missing wire clipping near an engine gearbox considered catastrophic?","back":"A loose piece of wire can be ingested by an engine inlet and destroy the engine."},{"front":"The slots on top of a castellated nut are known as _____.","back":"Castellations"},{"front":"What is the first step in installing a cotter pin?","back":"Torque the nut to specification using a calibrated wrench."},{"front":"If a castellated nut slot is $30^\\circ$ away from the bolt hole after torquing, what is the only airworthy action?","back":"Advance the nut slightly to the next slot alignment."},{"front":"Why is backing off a castellated nut to align a cotter pin prohibited?","back":"It reduces the clamping load below specification."},{"front":"What physical change occurs in a cotter pin after one use that makes it unsafe to reinstall?","back":"The development of micro-fatigue cracks from bending."},{"front":"What material is typically used for cotter pins?","back":"Low-carbon steel or stainless steel."},{"front":"In cotter pin installation, what is the purpose of splaying the prongs before bending?","back":"It prevents stress concentration that could crack the pin."},{"front":"Describe the correct configuration for a bent cotter pin.","back":"One prong over the bolt end and the second prong flat against the side of the nut."},{"front":"During inspection, what does a gap between the cotter pin loop head and the nut indicate?","back":"The pin is either the wrong size or was not fully inserted."},{"front":"What is the inspection requirement for the prongs of a cotter pin after bending?","back":"They must be flush and not project outward where they can snag wiring."},{"front":"What should a technician do if a cotter pin shows any visible cracks or sharp kinks after installation?","back":"Remove it immediately and replace it with a new one."},{"front":"Why are nylon-insert nuts (Nyloc) categorized as single-use hardware?","back":"The nylon loses grip effectiveness after the first installation."},{"front":"How does a jam nut resist loosening?","back":"By increasing clamping load when torqued against a primary nut."},{"front":"When is the use of thread-locking compound permitted in aviation?","back":"Only when specifically authorized by manufacturer documentation."},{"front":"What is the only non-single-use securing method among lockwire, cotter pins, and jam nuts?","back":"Jam nuts"},{"front":"If a technician finds a missing wire clipping during an engine job, what is the immediate FOD protocol?","back":"Stop work, keep cowlings open, and notify a supervisor to initiate a sweep."},{"front":"How does a split lock washer resist rotation?","back":"The helical spring bites into the fastener and mating surface under load."},{"front":"What reference must always be used to choose the correct fastener securing method?","back":"The aircraft's maintenance manual or assembly instructions."},{"front":"Why are cotter pins sized by both diameter and length?","back":"Diameter must match the bolt hole, and length must allow for proper bending."},{"front":"What does a \"self-checking system\" mean in the context of lockwire?","back":"Any fastener rotation attempt increases the tension on the wire."},{"front":"What is the primary function of the hex body of a castellated nut?","back":"To provide the clamping load identical to a standard hex nut."},{"front":"Why is time pressure never a valid reason to reuse a cotter pin?","back":"The risk of safety hardware failure, such as brake failure, outweighs the time saved."},{"front":"What distinguishes a good technician from a great one according to the source?","back":"Possessing a safety-conscious mindset that prioritizes airworthiness over convenience."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
