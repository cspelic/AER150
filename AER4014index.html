<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AER4014flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AER4014flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"Term: Countersink","back":"Definition: A cone-shaped recess machined into a hole to allow a flush-head fastener to sit level with or below the surface."},{"front":"Term: Flush Head Rivet","back":"Definition: A rivet with a flat or slightly countersunk head designed to sit flush with the aircraft skin surface."},{"front":"Term: Federal Gauge","back":"Definition: A precision measurement tool used to check whether a countersink or flush rivet head is high, low, or correctly set."},{"front":"Term: Scrap Material","back":"Definition: A piece of the same alloy and thickness as the actual part, used for practice and tool-setting before working on the assembly."},{"front":"Term: Countersink Cutter","back":"Definition: The rotating cutting tool—typically $100^{\\circ}$ for aluminum aircraft skins—used to create the cone-shaped recess."},{"front":"Term: Depth Stop","back":"Definition: The adjustable collar on the countersink cage that controls how deep the cutter travels into the material."},{"front":"In aircraft manufacturing, what are the three primary consequences of a countersink that is too shallow or too deep?","back":"Compromised joint strength, aerodynamic drag, and FAA non-compliance."},{"front":"Why must an assembler select scrap material with the exact same alloy and temper as the assembly part?","back":"Different tempers and alloys cut at different rates, which would result in an incorrect tool setting."},{"front":"How many locations should be measured with a micrometer when verifying the thickness of scrap material?","back":"At least two locations."},{"front":"Besides alloy and thickness, what surface conditions of scrap material must match the assembly part?","back":"Whether the material is clad or bare, and if it is primed or raw."},{"front":"What is the minimum required edge distance for placing practice holes on scrap material?","back":"At least $2 \\times$ the rivet diameter from any edge."},{"front":"To prevent deformation, practice holes should be spaced apart by at least _____ times the rivet diameter.","back":"$3 \\times$"},{"front":"What is the purpose of using a center punch at each hole location before drilling?","back":"It creates a dimple that prevents the drill bit from wandering."},{"front":"Which component of the countersink tool contains graduated markings to allow for precise, repeatable adjustments?","back":"The depth stop collar on the Microstop countersink cage."},{"front":"What is the standard cutter angle used for most aluminum aircraft flush-head rivets?","back":"$100^{\\circ}$"},{"front":"What occurs if the RPM of a pneumatic drill motor is set too slow during a countersinking operation?","back":"It produces a rough and irregular countersink."},{"front":"When setting up a countersink tool, why should you always begin with the depth stop set shallower than needed?","back":"Material can always be removed to reach depth, but it cannot be put back once cut."},{"front":"What is the first step in the operational sequence for countersinking a hole?","back":"Drill the pilot hole."},{"front":"What is the final step in the operational sequence for countersinking a hole?","back":"Inspect with a Federal gauge."},{"front":"Why is it critical to hold the drill motor perpendicular to the material surface during countersinking?","back":"Angled pressure creates an oval, off-angle countersink that prevents the rivet from seating flush."},{"front":"What must be done to the countersink hole before using a Federal gauge for an accurate reading?","back":"Clear all aluminum chips and debris from the recess."},{"front":"On a Federal gauge, what does a reading of zero indicate?","back":"The countersink is perfectly flush with the material surface."},{"front":"On a Federal gauge, what does a positive ($+$) reading indicate about the countersink?","back":"It is too shallow, meaning the rivet head will protrude."},{"front":"On a Federal gauge, what does a negative ($-$) reading indicate about the countersink?","back":"It is too deep, meaning the rivet head will sit below the surface."},{"front":"What is the typical tolerance allowed for countersink depth on most engineering drawings?","back":"Approximately $\\pm 0.002$ to $0.004$ inches."},{"front":"What is a common result of 'rocking' the Federal gauge during inspection?","back":"The pin reading will be inaccurate because the reference surface is not flat against the material."},{"front":"Why must you check the calibration date and size of the Federal gauge before use?","back":"Gauges are matched to specific rivet diameters, and an incorrect or uncalibrated size gives false data."},{"front":"What is the primary aerodynamic purpose of using flush head rivets on surfaces like wings?","back":"To eliminate protrusions that would otherwise increase drag."},{"front":"Which series of flush head rivet is specifically designed for thin sheet applications where material removal must be minimized?","back":"NAS1097 (Reduced Head)."},{"front":"The shop head on the back side of a driven rivet should have a width of _____ times the shank diameter.","back":"$1.5 \\times$"},{"front":"The shop head on the back side of a driven rivet should have a height of _____ times the shank diameter.","back":"$0.5 \\times$"},{"front":"What is the required action if a rivet head rocks or is not fully seated in the countersink after driving?","back":"The rivet is non-conforming and must be drilled out and replaced."},{"front":"In a standard microstop countersink cage, each graduation on the barrel typically represents an increment of _____ inch.","back":"$0.001$"},{"front":"Which direction should you usually turn the countersink barrel to increase the cutting depth?","back":"Clockwise."},{"front":"What must be done to the microstop cage immediately after making a depth adjustment and before cutting?","back":"Lock the setting with the knurled locking collar."},{"front":"What are the four steps of the 'Adjust-Test-Verify' loop?","back":"Inspect (gauge reading), Adjust (turn barrel), Cut New Hole (on scrap), and Verify (gauge again)."},{"front":"Why is it forbidden to re-cut the same practice hole after adjusting the countersink tool?","back":"The cutter will not remove material accurately from an existing countersink."},{"front":"If a Federal gauge reads $+0.003$ inches and the tool increment is $0.001$ inch per division, how many divisions must the tool be adjusted?","back":"Three divisions in the 'deeper' direction."},{"front":"What is the likely cause if a countersink hole is oval or off-center?","back":"The tool was held at an angle or the drill motor wobbled."},{"front":"What is the fix for a countersink with rough or torn edges?","back":"Replace the cutter, reduce the feed pressure, or check that the air pressure (RPM) is correct."},{"front":"What is the consequence of failing to tighten the locking collar on a countersink cage?","back":"The depth setting can drift under vibration, leading to inconsistent holes."},{"front":"When starting a new job card, can an assembler carry over a setting from a previous job? Why or why not?","back":"No; different material thicknesses require different depth relationships to the surface."},{"front":"If a countersink measures $-0.005$ inches on the Federal gauge, why can the hole not be fixed?","back":"The hole is already too deep, making it a permanent defect according to standard engineering repair manuals."},{"front":"Which FAA document provides the accepted methods and practices for aircraft inspection and rivet installation standards?","back":"FAA Advisory Circular AC 43.13-1B."},{"front":"What happens to non-conforming fasteners found by a Quality Inspector?","back":"They must be documented, drilled out, and reworked."},{"front":"Role: Countersink Cutter","back":"Specific Role: A rotating tool that removes material in a 100-degree cone shape to allow a flush fastener to seat."},{"front":"Role: Depth Stop Collar","back":"Specific Role: An adjustable threaded barrel that acts as a mechanical limit for how far the cutter can travel into the workpiece."},{"front":"Why should you use a permanent marker to label practice holes in sequence $(1, 2, 3...)$?","back":"It allows you to trace the adjustment sequence for review by an instructor or Quality Assurance."},{"front":"If a rivet head is 'proud' of the surface, what will the Federal gauge reading be?","back":"Positive ($+$)."},{"front":"What is the correct procedure for selecting scrap material from a bin?","back":"Find material tagged with the correct alloy, ensure no cracks/dents, and verify thickness with a micrometer."},{"front":"What tool is used to verify the thickness of the assembly material against the scrap material?","back":"A micrometer."},{"front":"How does a spring-loaded pin in a Federal gauge determine depth?","back":"It drops into the recess and measures the height difference relative to the gauge body sitting flat on the surface."},{"front":"During rivet installation, what part of the tool must be seated squarely against the rivet head to prevent defects?","back":"The rivet gun set nozzle."},{"front":"What is the most common setup mistake that leads to defects on the actual assembly part?","back":"Using the wrong scrap material for tool setup."},{"front":"What documents specify the exact rivet size, countersink angle, and spacing required for a job?","back":"Engineering drawings."},{"front":"The countersink cage should be turned _____ to decrease the depth of the cut.","back":"Counterclockwise."},{"front":"Why is it important to apply steady, even downward pressure rather than 'pumping' the tool?","back":"Controlled pressure ensures a smooth, consistent cut and prevents damage to the cutter or material."},{"front":"What is the military specification series for flush head rivets?","back":"MS20426."},{"front":"What part of the aircraft assembly process ensures that fasteners meet FAA-approved quality standards?","back":"Quality Inspection Plans and adherence to engineering drawings."},{"front":"What should be checked if the Federal gauge gives a different reading every time it is placed on the same hole?","back":"Check for chips in the hole, ensure the gauge is flat, or verify if the gauge is worn/uncalibrated."},{"front":"True or False: If a rivet head is too high, you can hammer it flat manually to meet specifications.","back":"False; it must be drilled out and the countersink must be corrected."},{"front":"What is the standard 'Precision Mindset' rule regarding the transition from scrap to production parts?","back":"Always adjust and re-verify on scrap; never adjust the tool and go directly to the assembly part."},{"front":"What is the primary reason to secure a workpiece before countersinking?","back":"A spinning cutter on a loose sheet can cause serious physical injury."},{"front":"What is the risk of over-driving a rivet with too many hammer blows?","back":"It flattens the shop head excessively and damages the parent material around the hole."},{"front":"On a job card, 'AN426AD4' refers to what specific fastener type?","back":"An aluminum $100^{\\circ}$ countersunk flush head rivet."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
