<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AER150CUT2002flashcards — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AER150CUT2002flashcards</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"Which two attachments are considered most essential for drilling in aircraft assembly?","back":"The drill guide and the drill stop."},{"front":"What specific aspect of the drilling process is controlled by a drill guide?","back":"The angle and direction of the drill bit."},{"front":"What specific aspect of the drilling process is controlled by a drill stop?","back":"The depth of the drilled hole."},{"front":"In aircraft assembly, drill guides typically ensure the drill bit enters the workpiece at a perpendicular angle of _____.","back":"$90^{\\circ}$"},{"front":"Which component of a drill guide assembly connects directly to the nose of the drill motor?","back":"The body (housing)."},{"front":"Term: Drill Bushing","back":"A hardened cylindrical sleeve that guides the drill bit along the correct axis."},{"front":"Which part of a drill guide prevents the bit from wandering at the entry point of the workpiece?","back":"The nose piece."},{"front":"What is the purpose of the locking mechanism on a drill guide?","back":"It secures the drill guide onto the drill motor."},{"front":"Why must a drill bushing be made from hardened tool steel?","back":"To resist wear from repeated drilling cycles."},{"front":"What is the consequence of using a drill bushing that is mismatched to the drill bit diameter?","back":"The bit will wobble and produce oversized or angled holes."},{"front":"Before mounting a drill guide, what must a technician select to ensure the hole diameter is correct?","back":"A bushing with an inside diameter that matches the drill bit size."},{"front":"During the drill guide operating procedure, where should the nosepiece be positioned?","back":"Flat and flush against the material surface at the marked hole location."},{"front":"Term: Drill Stop","back":"A small attachment that clamps onto the drill bit shank to prevent over-drilling."},{"front":"Which part of a drill stop is used to lock the collar onto the drill bit shank?","back":"The set screw."},{"front":"The _____ is the flat bottom surface of a drill stop that halts forward travel upon contact with the workpiece.","back":"Bearing face (or stop foot)"},{"front":"What is the function of chip relief slots in a drill stop?","back":"They allow chips and swarf to escape to prevent heat buildup."},{"front":"According to the manual, what is the primary reason for never setting a drill stop depth 'by feel'?","back":"It lacks the precision required for aircraft structure and leads to errors."},{"front":"Which tool should be used to verify the measurement of a drill stop before drilling production holes?","back":"Calipers or a depth gauge."},{"front":"In what specific scenario is the simultaneous use of a drill guide and drill stop standard procedure?","back":"When drilling through layered materials where breakthrough would damage internal components."},{"front":"Term: Drill Block","back":"A solid metal block containing accurately positioned bushings used for repetitive hole patterns."},{"front":"What feature of a drill block ensures that it is placed in a repeatable position on the part?","back":"Locating features such as pins, dowels, or reference surfaces."},{"front":"How do drill blocks ensure the interchangeability of components across an assembly line?","back":"By providing every part with an identical hole pattern."},{"front":"Which production tool is used to maintain perpendicularity in confined spaces within an aircraft structure?","back":"The right-angle drill attachment."},{"front":"When is an offset drill head utilized in aircraft assembly?","back":"When drilling close to walls or frames where the drill body would obstruct access."},{"front":"What are Automated Drilling Units (ADUs)?","back":"CNC-controlled systems that automatically handle guidance, depth control, and lubrication."},{"front":"Term: Drill Template","back":"A flat or contoured guide plate containing pre-drilled holes at precise locations."},{"front":"Why are drill templates marked with part numbers and revision levels?","back":"To prevent errors caused by using the wrong template or incorrect orientation."},{"front":"Which drill template material is preferred when the guide must conform to curved surfaces?","back":"Fiberglass or composite."},{"front":"What determines the selection of tool steel for a drill template instead of aluminum?","back":"A high-volume production requirement involving thousands of uses."},{"front":"Term: Fixture","back":"A production device used to hold, support, and locate a workpiece in a repeatable position."},{"front":"What is the function of 'supporting' in the context of aircraft manufacturing fixtures?","back":"It prevents the deflection of thin sheet metal during the drilling process."},{"front":"Which type of fixture is used to position finished parts for dimensional verification?","back":"Inspection fixtures."},{"front":"How does a drill jig differ from a standard drill fixture?","back":"A jig guides the drill bit through bushings, whereas a fixture only holds and locates the part."},{"front":"In a drill jig, what features index the workpiece to a repeatable position?","back":"Locating pins and nests."},{"front":"Name the highest level of manual drilling control available in aircraft manufacturing.","back":"The drill jig."},{"front":"Operational Step: Inspect templates and jigs for cracks or damaged bushings before every use.","back":"Safety Goal: Prevents the use of inaccurate tooling that would multiply costs through maintenance failure."},{"front":"Operational Step: Remove metal chips and debris from bushing holes after every use.","back":"Safety Goal: Prevents chip contamination from deflecting the drill bit and producing off-location holes."},{"front":"Operational Step: Store templates flat or in purpose-made racks.","back":"Safety Goal: Prevents warpage that would compromise the accuracy of the hole pattern."},{"front":"Operational Step: Verify that drill stop set screws are fully tightened before drilling.","back":"Safety Goal: Prevents the collar from shifting and causing incorrect hole depth."},{"front":"Operational Step: Use clamps, fixtures, or vises to secure small workpieces.","back":"Safety Goal: Prevents the part from rotating and causing injury or damage."},{"front":"What is a common sign that a drill bushing has worn out and needs replacement?","back":"The drill bit exhibits side play when inserted into the bushing."},{"front":"Why is 'Tool Revision Control' critical when an engineering drawing is updated?","back":"It ensures that production tooling is modified to prevent major quality escape risks."},{"front":"Who is authorized to modify or recertify production tooling in an aircraft facility?","back":"Authorized tool room personnel only."},{"front":"Which drilling error is specifically prevented by using a drill stop?","back":"Wrong depth (drilling too deep)."},{"front":"Which error results when chips are trapped under a template during drilling?","back":"Chip damage to the workpiece surface."},{"front":"What attachment is used solely to ensure the drill bit enters the workpiece perpendicularly?","back":"The drill guide."},{"front":"What is the key limitation of using a standalone drill guide?","back":"It does not control the depth of the hole."},{"front":"What is the key limitation of using a standalone drill stop?","back":"It does not guide the angle of the drill bit."},{"front":"What are index holes on a drill template used for?","back":"Aligning the template to reference features on the part before drilling."},{"front":"What material is typically used for lightweight disposable templates?","back":"Mylar or plastic film."},{"front":"Which component of a drill stop prevents the collar from slipping during operation?","back":"The set screw."},{"front":"How should a technician check for 'side play' in a drill bushing?","back":"By inserting the drill bit into the bushing and checking for lateral movement."},{"front":"What is the primary function of assembly fixtures?","back":"Holding major structural components in position for subassembly buildup."},{"front":"Why must the drill guide be fully seated and locked onto the drill motor nose?","back":"To ensure it cannot rotate or slip during the drilling operation."},{"front":"A technician observes scoring inside a bushing bore; what action should be taken?","back":"The bushing must be replaced by a qualified tool room technician."},{"front":"What is the main benefit of using a drill template or block for repetitive patterns?","back":"Fast and accurate pattern transfer without individual measurements."},{"front":"Why is lateral force on the drill handle discouraged when using a drill guide?","back":"It could deflect the drill bit and compromise hole accuracy."},{"front":"Which part of the drill stop assembly is typically adjusted using an Allen wrench?","back":"The set screw."},{"front":"What is the safety risk of holding a workpiece by hand while drilling?","back":"The part may spin with the drill bit, leading to operator injury."},{"front":"In the 'Drill Jig Step-by-Step' process, what follows the step of securing clamps?","back":"Inserting the drill bit through the guide bushing."},{"front":"What is the function of 'locating' in a production fixture?","back":"Positioning the part against established datum surfaces."},{"front":"What ensures the dimensional stability of a drill block body?","back":"Using materials like tool steel or hardened aluminum alloy."},{"front":"How does a drill guide prevent angled holes caused by hand pressure variation?","back":"By constraining the drill bit motion to a single, perpendicular axis."},{"front":"Which production tool combines guidance, depth control, and lubrication automatically?","back":"An Automated Drilling Unit (ADU)."},{"front":"What action should be taken if a tool's calibration date has expired?","back":"The tool must not be used and should be sent for recertification."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
