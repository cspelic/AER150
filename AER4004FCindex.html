<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AER4004flashcards (1) — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F0E7;--paper-alt:#ECE6D6;--card:#FFFFFF;--ink:#23201A;--ink-soft:#5B564A;--accent:#145A4A;--accent-dark:#0E463A;--accent-tab:#8B3A2F;--rule:#D9D2C1;--focus:#0E463A;--radius:10px;font-size:16px;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;}
h1{font-family:'Public Sans',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0 0 .3em;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.02em;}
.skip-link{position:absolute;left:-999px;top:0;background:var(--accent-dark);color:#fff;padding:.75em 1.25em;z-index:100;border-radius:0 0 8px 0;font-weight:600;}
.skip-link:focus{left:0;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}
header.top{border-bottom:2px solid var(--ink);padding:1.75rem 1.5rem 1.25rem;max-width:700px;margin:0 auto;}
header.top .eyebrow{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dark);background:var(--paper-alt);border:1px solid var(--rule);padding:.2em .6em;border-radius:4px;margin-bottom:.6rem;}
main{max-width:700px;margin:0 auto;padding:1.5rem;}
.deck-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem;}
.stage{perspective:1400px;max-width:560px;margin:0 auto 1.25rem;}
.card-face{position:relative;width:100%;min-height:260px;border-radius:var(--radius);background:transparent;border:none;padding:0;cursor:pointer;display:block;}
.card-inner{display:block;position:relative;width:100%;height:100%;min-height:260px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.card-face[aria-pressed="true"] .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--radius);box-shadow:0 2px 0 var(--rule),0 10px 24px -12px rgba(35,32,26,.35);padding:2rem 1.75rem;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face::before{content:"";position:absolute;left:1.75rem;right:1.75rem;top:3.2rem;height:2px;background:repeating-linear-gradient(to right,var(--rule) 0 10px,transparent 10px 16px);}
.face .tag{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--accent-tab);padding:.25em .6em;border-radius:3px 3px 3px 0;}
.face-badges{display:flex;align-items:center;gap:.5rem;align-self:flex-start;margin-bottom:1.4rem;}
.verified-stamp-wrap{position:absolute;right:1.1rem;bottom:1.1rem;transform:rotate(-9deg);pointer-events:none;}
.verified-stamp-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--accent);color:var(--accent);opacity:.88;}
.verified-stamp-ring svg{flex:none;}
.verified-stamp-text{font-family:'Public Sans',sans-serif;font-weight:800;font-size:.5rem;line-height:1.2;letter-spacing:.06em;text-align:center;text-transform:uppercase;}
.face.back .tag{background:var(--accent-dark);}
.face .content{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:1.3rem;line-height:1.45;flex:1;display:flex;align-items:center;overflow-wrap:anywhere;}
.face .idx{position:absolute;top:.9rem;right:1rem;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--ink-soft);}
.face.back{transform:rotateY(180deg);}
.controls{display:flex;justify-content:center;align-items:center;gap:.6rem;flex-wrap:wrap;}
.btn{font-family:'Public Sans',sans-serif;font-weight:600;font-size:.95rem;border-radius:8px;border:1.5px solid var(--accent-dark);background:var(--accent);color:#fff;padding:.7em 1.3em;min-height:44px;cursor:pointer;}
.btn:hover{background:var(--accent-dark);}
.btn.secondary{background:var(--card);color:var(--accent-dark);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.hint{color:var(--ink-soft);font-size:.9rem;text-align:center;}
#sr-status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
@media (prefers-reduced-motion: reduce){.card-inner{transition:none;}}
@media (max-width:500px){.face .content{font-size:1.2rem;}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="top">
<span class="eyebrow">Catalog Drawer</span>
<h1>AER4004flashcards (1)</h1>
</header>
<main id="main">
<div class="deck-meta"><span class="mono" id="progress"></span></div>
<div class="stage">
<button type="button" class="card-face" id="card-btn" aria-pressed="false">
<span class="card-inner" id="card-inner">
<span class="face front"><span class="idx mono" id="idx-front"></span><span class="face-badges"><span class="tag">Question</span></span><span class="content" id="front-text"></span></span>
<span class="face back" aria-hidden="true"><span class="idx mono" id="idx-back"></span><span class="face-badges"><span class="tag">Answer</span></span><span class="content" id="back-text"></span><span class="verified-stamp-wrap" aria-hidden="true"><span class="verified-stamp-ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="verified-stamp-text">Verified<br>Correct</span></span></span></span>
</span>
</button>
</div>
<div class="controls">
<button type="button" class="btn secondary" id="prev-btn">← Previous</button>
<button type="button" class="btn" id="flip-btn">Flip card</button>
<button type="button" class="btn secondary" id="next-btn">Next →</button>
<button type="button" class="btn secondary" id="shuffle-btn">Shuffle</button>
</div>
<p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> on the focused card to flip it, and use the ←/→ arrow keys to move between cards.</p>
<div id="sr-status" aria-live="polite"></div>
</main>
<script>
(function(){
"use strict";
var cards = [{"front":"What is the physical definition of a burr in metalworking?","back":"A small ridge or raised edge of displaced material left behind after drilling."},{"front":"How does a drill bit physically create a burr during the drilling process?","back":"It pushes material outward rather than cutting it cleanly away."},{"front":"Where are the three specific locations a burr typically forms on a drilled hole?","back":"The entry side, the exit side, and inside the hole wall."},{"front":"Why is the exit side burr considered the primary concern for an aircraft assembler?","back":"It is typically the largest and most problematic burr formed."},{"front":"How do burrs interfere with the structural integrity of a fastener joint?","back":"They prevent fasteners from seating flush, which reduces proper clamping force."},{"front":"In terms of fatigue, why are sharp burr edges dangerous in flight structures?","back":"They create stress risers where cracks can initiate under cyclic loading."},{"front":"What environmental risk is increased by the presence of rough burr edges in aluminum?","back":"Corrosion risk due to the trapping of moisture and debris."},{"front":"State the 'Golden Rule' regarding the timing of deburring in aircraft assembly.","back":"Every drilled hole must be deburred before a fastener is installed, without exception."},{"front":"What is the primary objective of the deburring process?","back":"To leave a hole with a smooth, clean edge for correct fastener seating."},{"front":"Term: Chamfer","back":"Definition: A very slight, barely perceptible bevel around the circumference of a hole."},{"front":"What is the fundamental difference between deburring and countersinking?","back":"Deburring only removes the burr, whereas countersinking intentionally enlarges the hole top."},{"front":"What are the two most fundamental tools used for deburring in initial aircraft assembly?","back":"The open countersink (countersink cage) and the flat file."},{"front":"What is the function of an open countersink (microstop countersink) tool?","back":"It spins a cutter at a controlled, consistent depth to remove burrs quickly."},{"front":"Anatomy: Cage Body (Open Countersink)","back":"Definition: The outer housing that rides on the material surface to control the depth of cut."},{"front":"What is the typical angle for most aircraft fastener countersink cutters?","back":"$100^{\\circ}$."},{"front":"Anatomy: Pilot (Open Countersink)","back":"Definition: A component that centers the cutter in the hole to ensure a concentric chamfer."},{"front":"Anatomy: Depth Adjustment Ring (Open Countersink)","back":"Definition: A micrometer-style collar that sets how far the cutter protrudes below the cage foot."},{"front":"When setting up a countersink for deburring, what is the target chamfer depth range?","back":"$0.005\"$ to $0.010\"$."},{"front":"Why is it mandatory to perform a test cut on scrap material before deburring a part?","back":"To verify the depth setting is correct for the specific material and thickness."},{"front":"Usage Technique: Positioning the countersink cage.","back":"Place the cage foot flat and firmly directly over the hole, ensuring it is perpendicular."},{"front":"Usage Technique: Pressure application for a countersink cage.","back":"Apply steady, light downward pressure without rocking or angling the tool."},{"front":"Inspection Method: Visual check for a smooth chamfer.","back":"Criteria: A uniform, even bevel around the entire hole with no flat spots."},{"front":"Inspection Method: Tactile check for correct chamfer depth.","back":"Criteria: The chamfer should be barely visible and not feel like a significant step to a fingernail."},{"front":"Inspection Method: Visual check for tool stability (Chatter Marks).","back":"Criteria: The chamfer surface should be smooth and free of circular vibration marks."},{"front":"What is the negative consequence of making 'too deep a cut' while deburring?","back":"It weakens the joint area and may enlarge the hole beyond tolerance."},{"front":"How does 'tilting the tool' affect the quality of a deburred hole?","back":"It creates an uneven, one-sided chamfer."},{"front":"What is the result of using an $82^{\\circ}$ cutter on a $100^{\\circ}$ fastener application?","back":"It leaves material proud of the surface because the angles do not match."},{"front":"What are three advantages of using a flat file for deburring?","back":"It requires no power, works in tight spaces, and provides tactile feedback."},{"front":"Which type of file is preferred for deburring aluminum aircraft skins to produce a smooth finish?","back":"A single-cut file."},{"front":"Why should an assembler avoid using a bastard-cut file on thin aluminum sheet?","back":"It is too aggressive for the material thickness."},{"front":"Which file coarseness levels are recommended for aircraft deburring?","back":"Second-cut or smooth-cut."},{"front":"Usage Technique: Positioning the file for hand deburring.","back":"Hold the file flat against the material surface and centered over the hole."},{"front":"Usage Technique: Filing stroke direction and pressure.","back":"Apply light, even pressure on the forward (push) stroke only."},{"front":"Usage Technique: Hand position for the guide hand during filing.","back":"Place fingertips lightly on the flat of the file near the toe to control the angle."},{"front":"Usage Technique: Hand position for the handle hand during filing.","back":"Grip the handle firmly with the dominant hand, resting the thumb on top."},{"front":"Usage Technique: Rotating the workpiece during filing.","back":"Rotate the part $90^{\\circ}$ every few strokes to ensure even material removal."},{"front":"How should an assembler determine when a hole is finished being file-deburred?","back":"By feeling and inspecting the edge rather than counting a fixed number of strokes."},{"front":"Inspection Method: Tactile check of a file-deburred hole.","back":"Criteria: Carefully drag the finger pad around the edge to ensure it feels smooth with no catching."},{"front":"Inspection Method: Visual check of a file-deburred hole.","back":"Criteria: The burr is completely gone with no jagged lip or torn metal visible."},{"front":"Inspection Method: Dimension check after deburring.","back":"Criteria: Ensure the hole diameter remains within tolerance and has not been enlarged."},{"front":"What happens if a technician files a hole in 'one direction only' without rotating the part?","back":"Material is removed unevenly, leaving burrs on the perpendicular sides."},{"front":"How does 'rocking the file' during a stroke affect the workpiece surface?","back":"It creates a dished or rounded surface instead of a flat one."},{"front":"Why must an assembler avoid pulling a file back across the metal under pressure?","back":"It loads the teeth with material, dulls the file, and causes surface scratches."},{"front":"Term: Pinning","back":"Definition: A condition where aluminum particles load up and clog the teeth of a file."},{"front":"How does a 'pinned' file affect the quality of the deburring work?","back":"It scratches and smears the metal surface instead of cutting cleanly."},{"front":"How often should a file card be used when deburring aluminum?","back":"Every few holes."},{"front":"What is the proper method for storing files to prevent tooth damage?","back":"Hang them or lay them individually on a soft surface, never piled on each other."},{"front":"Why is using a file without a handle considered a serious safety hazard?","back":"The bare tang can puncture or injure the technician's hand."},{"front":"When is an open countersink preferred over a flat file for deburring?","back":"When deburring many holes in a row for speed and consistency."},{"front":"When is a flat file preferred over an open countersink for deburring?","back":"When working in confined areas or deburring the exit side by feel."},{"front":"What is the standard four-step sequence for preparing a hole in aircraft assembly?","back":"Drill $\\rightarrow$ Deburr $\\rightarrow$ Clean $\\rightarrow$ Install Fastener."},{"front":"Why is it forbidden to jump ahead or combine steps in the Drill-Deburr sequence?","back":"It is a process violation that can result in rejected assemblies and costly rework."},{"front":"Why must assemblers avoid using steel tools that can embed iron particles in aluminum?","back":"To prevent galvanic corrosion."},{"front":"What PPE is required specifically for the flying metal fragments generated during deburring?","back":"Safety glasses."},{"front":"Under what condition is hearing protection required during the deburring process?","back":"When operating pneumatic countersink tools in enclosed assembly areas."},{"front":"Quality Standard: No Raised Material.","back":"Definition: Zero tolerance for any remaining burr; the edge must be flush with or below the surface."},{"front":"Quality Standard: No Damage to Surrounding Surface.","back":"Definition: File marks, gouges, or chatter marks outside the edge are nonconformances."},{"front":"Inspection Method: QA Raking Light.","back":"Criteria: Using light at a low angle to reveal remaining raised material invisible under direct light."},{"front":"Which two key items should an assembler check on an engineering drawing before deburring?","back":"Hole diameter tolerance and edge break callouts."},{"front":"What is the most frequently overlooked aspect of deburring by new assemblers?","back":"Forgetting to deburr the bottom (exit) side of the hole."},{"front":"How should an assembler inspect the exit side of a hole that is hidden from direct view?","back":"Inspect by feel and use an inspection mirror if needed."},{"front":"Why is poor deburring cited in accident investigation reports?","back":"It is a contributing factor in fastener-related structural failures."}];
var order = cards.map(function(_, i){ return i; });
var current = 0;
var cardBtn = document.getElementById("card-btn");
var frontText = document.getElementById("front-text");
var backText = document.getElementById("back-text");
var idxFront = document.getElementById("idx-front");
var idxBack = document.getElementById("idx-back");
var progressEl = document.getElementById("progress");
var prevBtn = document.getElementById("prev-btn");
var nextBtn = document.getElementById("next-btn");
var flipBtn = document.getElementById("flip-btn");
var shuffleBtn = document.getElementById("shuffle-btn");
var srStatus = document.getElementById("sr-status");
function shuffleArray(arr){ var a = arr.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function renderCard(announce){
  var c = cards[order[current]];
  frontText.textContent = c.front;
  backText.textContent = c.back;
  idxFront.textContent = String(current + 1).padStart(3, "0");
  idxBack.textContent = String(current + 1).padStart(3, "0");
  cardBtn.setAttribute("aria-pressed", "false");
  cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
  progressEl.textContent = "Card " + (current + 1) + " of " + cards.length;
  if (announce) srStatus.textContent = "Card " + (current + 1) + " of " + cards.length + ". Question: " + c.front;
  prevBtn.disabled = cards.length <= 1;
  nextBtn.disabled = cards.length <= 1;
}
function flipCard(){
  var pressed = cardBtn.getAttribute("aria-pressed") === "true";
  var c = cards[order[current]];
  if (pressed){
    cardBtn.setAttribute("aria-pressed", "false");
    cardBtn.setAttribute("aria-label", "Question: " + c.front + ". Activate to show the answer.");
    srStatus.textContent = "Showing question: " + c.front;
  } else {
    cardBtn.setAttribute("aria-pressed", "true");
    cardBtn.setAttribute("aria-label", "Verified answer: " + c.back + ". Activate to show the question.");
    srStatus.textContent = "Showing verified answer: " + c.back;
  }
}
function goTo(delta){
  if (cards.length < 2) return;
  current = (current + delta + cards.length) % cards.length;
  renderCard(true);
}
cardBtn.addEventListener("click", flipCard);
flipBtn.addEventListener("click", function(){ cardBtn.focus(); flipCard(); });
prevBtn.addEventListener("click", function(){ goTo(-1); });
nextBtn.addEventListener("click", function(){ goTo(1); });
shuffleBtn.addEventListener("click", function(){ order = shuffleArray(order); current = 0; renderCard(false); srStatus.textContent = "Deck shuffled. Card 1 of " + cards.length; });
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(-1); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); goTo(1); }
});
if (cards.length){ renderCard(true); } else { progressEl.textContent = "No cards found."; }
})();
</script>
</body>
</html>
